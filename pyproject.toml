[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastmcp-sqltools"
version = "0.4.1"
description = "FastMCP SQL server with support for PostgreSQL, MySQL, and SQLite"
authors = [
  { name = "Ola Tarkowska", email = "ola@entrypoint.tech" }
]
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "asyncpg>=0.21.0",
    "aiomysql>=0.3.0",
    "aiosqlite",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.1.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.1.1",
    "twine>=7.0.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "mypy>=2.4.1",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "B",  # flake8-bugbear
  "I",  # isort
]

[project.scripts]
fastmcp-sqltools = "fastmcp_sqltools.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastmcp_sqltools"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".DS_Store",
  ".pre-commit-config.yaml",
  "justfile",
  ".github",
  ".gitignore",
]
